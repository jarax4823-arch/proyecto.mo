<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentación | Mountain Roses</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-page="documentation">
    <main class="content">
        <section class="module-page">
            <div class="module-heading">
                <div>
                    <p class="eyebrow">CENTRO DE CONOCIMIENTO</p>
                    <h1>Documentación</h1>
                    <p>Encuentra guías, procedimientos y recursos internos.</p>
                </div>
            </div>
            <div class="module-grid">
                <a class="report-card" href="#">
                    <div class="card-icon"><i data-lucide="book-open"></i></div>
                    <div class="card-info">
                        <h3>Guías operativas</h3>
                        <p>Procedimientos y documentos de consulta</p>
                    </div>
                    <i data-lucide="arrow-up-right" class="arrow-icon"></i>
                </a>
                <a class="report-card" href="#">
                    <div class="card-icon"><i data-lucide="folder-open"></i></div>
                    <div class="card-info">
                        <h3>Recursos internos</h3>
                        <p>Material de apoyo para equipos</p>
                    </div>
                    <i data-lucide="arrow-up-right" class="arrow-icon"></i>
                </a>
            </div>
        </section>
    </main>
    <script src="../js/main.js"></script>
    <script src="../js/layout.js"></script>
</body>
</html>
