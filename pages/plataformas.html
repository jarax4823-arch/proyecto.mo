<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataformas | Mountain Roses</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-page="platforms">
    <main class="content">
        <section class="module-page">
            <div class="module-heading">
                <div>
                    <p class="eyebrow">CENTRO DE ACCESO</p>
                    <h1>Plataformas Empresariales</h1>
                    <p>Encuentra rápidamente las herramientas que necesitas para trabajar.</p>
                </div>
                <span class="module-count">19 plataformas</span>
            </div>
            <div class="platform-toolbar">
                <label class="search-bar" for="platform-search">
                    <i data-lucide="search" class="search-icon"></i>
                    <input id="platform-search" type="search" placeholder="Buscar una plataforma...">
                </label>
                <div class="filter-tabs" aria-label="Filtrar plataformas">
                    <button class="tab-btn" data-platform-filter="Todas">Todas</button>
                    <button class="tab-btn" data-platform-filter="Administración">Administración</button>
                    <button class="tab-btn" data-platform-filter="Cultivo">Cultivo</button>
                    <button class="tab-btn" data-platform-filter="Operaciones">Operaciones</button>
                    <button class="tab-btn" data-platform-filter="Tecnología">Tecnología</button>
                </div>
            </div>
            <div id="platform-grid" class="platforms-grid"></div>
            <p id="platform-empty" class="empty-state" hidden>No encontramos plataformas con esos criterios.</p>
        </section>
    </main>
    <script src="../js/main.js"></script>
    <script src="../js/platforms-data.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/platforms-page.js"></script>
</body>
</html>
